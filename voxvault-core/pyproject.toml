[project]
name = "voxvault-core"
version = "0.1.3"
description = "Grava, transcreve e indexa reunioes localmente no Windows, sem depender da plataforma de reuniao."
readme = "README.md"
# Piso vindo do numpy, que exige 3.12. Nao ha teto: o soxr publica wheel de
# ABI estavel (cp312-abi3), que instala de 3.12 para cima; ctranslate2 cobre
# ate 3.14; faster-whisper e soundfile sao Python puro; e a captura e ctypes
# sobre a API do sistema, sem extensao compilada e portanto sem ABI propria.
# Verificado no portao de captura da Fase 1 (tarefa 2.0.4).
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
    "soxr>=0.5",
    "soundfile>=0.13",
]

[project.optional-dependencies]
# Motor de transcricao local. Separado para que o servidor MCP e a CLI
# nunca carreguem o runtime de inferencia sem precisar.
engine = [
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
    # Declared rather than inherited from faster-whisper: media import and
    # lossless compression read and write through PyAV, and the explicit model
    # download goes through huggingface_hub. A transitive dependency can
    # disappear in a minor release of the package that brought it.
    "av>=14",
    "huggingface-hub>=0.23",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
voxvault = "voxvault.cli.__main__:main"
voxvault-mcp = "voxvault.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: exige dispositivo de audio real",
    "gpu: exige GPU NVIDIA disponivel",
    "slow: leva mais de 30 segundos",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# Deliberately not the full default set: this codebase prefers explaining a
# choice in prose over silencing a rule, so the rules enabled here are the ones
# that catch real mistakes rather than style opinions.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter, not by failing a build
    "B008",    # argparse and dataclass defaults legitimately call functions
    "RUF001",  # pt-BR strings contain characters this rule flags as ambiguous
    "RUF002",
    "RUF003",
    # try/except/pass in a cleanup path is deliberate here and always carries a
    # comment saying why the failure is being swallowed. contextlib.suppress
    # would hide that explanation behind a name.
    "SIM105",
    # The generic in build_page predates PEP 695 syntax and reads fine.
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "E402"]
# WavFile deliberately holds the file open across calls: it is appended to for
# the length of a meeting, and a context manager would defeat the point.
"src/voxvault/session/wavfile.py" = ["SIM115"]
