[project]
name = "voxvault-core"
version = "0.1.0"
description = "Grava, transcreve e indexa reunioes localmente no Windows, sem depender da plataforma de reuniao."
readme = "README.md"
# Piso vindo do numpy, que exige 3.12. Nao ha teto: o soxr publica wheel de
# ABI estavel (cp312-abi3), que instala de 3.12 para cima; ctranslate2 cobre
# ate 3.14; faster-whisper e soundfile sao Python puro; e a captura e ctypes
# sobre a API do sistema, sem extensao compilada e portanto sem ABI propria.
# Verificado no portao de captura da Fase 1 (tarefa 2.0.4).
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
    "soxr>=0.5",
    "soundfile>=0.13",
]

[project.optional-dependencies]
# Motor de transcricao local. Separado para que o servidor MCP e a CLI
# nunca carreguem o runtime de inferencia sem precisar.
engine = [
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[project.scripts]
voxvault = "voxvault.cli.__main__:main"
voxvault-mcp = "voxvault.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: exige dispositivo de audio real",
    "gpu: exige GPU NVIDIA disponivel",
    "slow: leva mais de 30 segundos",
]
