# Build artefacts go to D:, not next to the source.
#
# E: holds the code and has a few gigabytes free; a single debug build of this
# dependency tree is about 2.8 GB and filled the volume completely on the first
# attempt. The project already separates the two for the same reason -- code on
# E:, data on D: -- and the build output belongs on the large volume with the
# data, not on the small one with the source.
#
# Nothing else depends on this path: it can be deleted at any time and the next
# build recreates it.
[build]
target-dir = "D:/VoxVault-build/voxvault-app"
