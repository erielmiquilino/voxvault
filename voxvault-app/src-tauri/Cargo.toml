[package]
name = "voxvault-app"
version = "0.1.3"
description = "Desktop surface for the VoxVault local meeting recorder"
authors = ["Eriel Miquilino"]
edition = "2021"

[lib]
name = "voxvault_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the player read a meeting's FLAC straight from
# the data directory instead of copying it through a command.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
# The global shortcut is the point of the tray: starting a recording must not
# require finding a window first.
tauri-plugin-global-shortcut = "2"
# Single instance is a requirement, not a convenience: two windows would mean
# two clients racing on the same recording.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree through Tauri; taken directly for what the standard
# library has no portable equivalent of: free space, the process's memory, the
# `voxvault:` scheme a notification's click opens, and `voxvault` on the user's
# PATH.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The notifications, built as XML so that a click opens an address: the
# wrapper crate only calls back into the process, which a click in the
# notification center never reaches. Already in the tree through Tauri.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
